name: Build ps2-manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Linux x86_64 (musl static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Clippy (informativo)
        run: cargo clippy --release --all-targets

      - name: Build (musl estático, zero deps dinâmicas)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package (tar.gz + sha256)
        run: |
          TAG=$(git rev-parse --short HEAD)
          ART="ps2-manager-linux-x86_64-${TAG}"
          tar -czf "${ART}.tar.gz" -C target/x86_64-unknown-linux-musl/release ps2-manager
          sha256sum "${ART}.tar.gz" > "${ART}.tar.gz.sha256"
          echo "ARTIFACT=${ART}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps2-manager-linux-x86_64
          path: |
            ps2-manager-linux-x86_64-*.tar.gz
            ps2-manager-linux-x86_64-*.tar.gz.sha256
          if-no-files-found: error

  appimage:
    name: AppImage 1-clique (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build (musl estático)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package AppImage (launcher 1-clique + .desktop + ícone)
        run: |
          chmod +x dist/AppRun dist/build-appimage.sh
          ./dist/build-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps2-manager-AppImage_x86_64
          path: |
            build/ps2-manager-x86_64.AppImage
            build/ps2-manager-x86_64.AppImage.sha256
          if-no-files-found: error
