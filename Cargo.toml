[package]
name = "ps2-manager"
version = "0.2.1"
edition = "2021"
description = "Gerenciador nativo Linux para coleções PS2/OPL — ISO9660, ZSO, VMC, ul.cfg, deploy OPL-Mod-PTBR"
license = "MIT"
repository = "https://github.com/Chrispsz/OPL-Mod-PTBR"

[dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = "0.11"
rayon = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ratatui = "0.29"
crossterm = "0.28"
sha2 = "0.11.1"
toml = "1.2.1"
sevenz-rust = "0.6.1"
# bindings p/ statvfs/fallocate — não adiciona biblioteca externa (a libc já
# é linkada pela std; musl estático inclui a própria implementação)
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
